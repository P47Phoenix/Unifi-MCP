# CI for the UniFi MCP server.
#
# NFR-20 requires the server to run on macOS, Linux and Windows, so the matrix is
# all three rather than ubuntu-only — the paths this project touches (path
# separators in the spec loader, keychain absence on headless Linux, npx
# behaviour under PowerShell) are exactly the ones that differ per platform.
#
# Node 20 is the single supported major: package.json declares `engines.node
# >=18.17`, the vendored spec loader and the MCP SDK both target modern Node, and
# a second Node major in the matrix would triple the run for no covered risk.
#
# Step ordering is deliberate — cheapest gate that can fail first:
#   typecheck  -> compile errors
#   test       -> unit and contract tests
#   specs:verify -> offline digest/count check, sub-second, no network (NFR-17)
#   coverage:check -> registry build + FR-59 coverage
#   budget:check / lint:tools -> G-3, G-9 gates on the tool surface
#   build + Inspector --cli -> FR-60 end-to-end smoke test
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # NFR-28: the `sdk-canary` job below reports SDK drift BETWEEN pull requests,
  # not only alongside them. A canary that only runs when someone happens to
  # open a PR reports a vendor release whenever the next PR lands, which on a
  # quiet week is no report at all. Off the hour deliberately — every other
  # weekly cron in the world fires at :00.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # D-3: MCP Inspector is load-bearing (the build skill prescribes it and ships
  # no test scaffolding of its own), so it is pinned rather than floating. A
  # floating `@latest` here means a vendor release can turn CI red on a commit
  # that changed nothing. Bump this deliberately, in its own PR.
  #
  # Note: the Inspector declares `engines.node >= 22`, but its CLI runs fine
  # under npx on Node 20 with an EBADENGINE warning. The server under test is
  # what must run on Node 20, and it does.
  INSPECTOR_VERSION: 2.0.0

jobs:
  verify:
    name: verify (node 20, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # R-7: the build skill ships no test scaffolding, so the harness is this
      # repo's own — scripts/run-tests.mjs over test/*.test.ts, run via `npm
      # test`. It sits second because unit and contract failures are the
      # cheapest signal to read after a typecheck error.
      - name: Test
        run: npm test

      # FR-01/FR-05: offline digest and operation-count gate. No network.
      - name: Verify vendored specs
        run: npm run specs:verify

      # FR-59/G-1: every spec operation registered or blocklisted with a reason.
      - name: Coverage check
        run: npm run coverage:check

      # FR-59 requires the report to be committed so reviewers can diff it across
      # spec bumps. A drifted report means someone changed the registry or the
      # blocklist without regenerating it, and the diff a reviewer reads would be
      # stale.
      - name: Assert coverage-report.json is committed and current
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if ! git diff --exit-code -- coverage-report.json; then
            echo "::error title=Stale coverage report::coverage-report.json differs from the committed copy. Run 'npm run coverage:check' and commit the result (FR-59)."
            exit 1
          fi

      # G-3/NFR-18: advertised tools/list schema token budget.
      - name: Token budget
        run: npm run budget:check

      # NFR-01..NFR-04, NFR-10, FR-58: directory-review constraints (G-9).
      - name: Lint tool manifest
        run: npm run lint:tools

      - name: Build
        run: npm run build

      # FR-60: MCP Inspector in --cli mode is the smoke test; no bespoke MCP
      # harness is invented. It exercises dist/index.js — the same artifact the
      # container declares as its ENTRYPOINT — and is deliberately unguarded:
      # the Build step above runs unconditionally, so any existence check here
      # could only turn a broken build into a green skip.
      - name: MCP Inspector CLI smoke test
        shell: bash
        run: |
          echo "Running MCP Inspector ${INSPECTOR_VERSION} --cli against dist/index.js"

          # Placeholder credentials, deliberately. NFR-17 requires the server to
          # start and advertise its full tool surface with all outbound traffic
          # blocked, and `tools/list` makes no upstream request — so a syntactically
          # valid key that authenticates with nothing is exactly the right input,
          # and CI needs no real secret. UNIFI_CONSOLE_ID switches Network and
          # Protect on via the Cloud Connector so all four APIs are advertised;
          # UNIFI_ENABLE_WRITES is needed because FR-44 makes read-only the default
          # and the write execution tool is otherwise absent from tools/list.
          #
          # The Inspector does NOT pass its own environment to the spawned server;
          # variables must go through its `-e` flag.
          # FR-60: "The CI job fails the build on a non-zero Inspector exit."
          if ! npx --yes "@modelcontextprotocol/inspector@${INSPECTOR_VERSION}" \
                 --cli node dist/index.js \
                 -e UNIFI_API_KEY=ci-smoke-test-placeholder-key \
                 -e UNIFI_CONSOLE_ID=0000000000000000 \
                 -e UNIFI_ENABLE_WRITES=network,protect \
                 --method tools/list > tools-list.json; then
            status=$?
            echo "::error title=Inspector failed::MCP Inspector exited ${status} (FR-60 fails the build on a non-zero exit)."
            cat tools-list.json || true
            exit "${status}"
          fi

          cat tools-list.json

          # FR-74, §14 item 14: the expected surface is COMPUTED from the build
          # under test, never enumerated here. `loadConfig` is handed the same
          # four variables the Inspector handed the server, so `advertisedTools`
          # returns exactly the set that process should advertise — this is a
          # real `tools/list` frame compared against the registry, in BOTH
          # directions, rather than against a list someone maintains by hand.
          #
          # What this replaces: an eight-name literal array and a `> 12` cap.
          # Both were correct on the day they were written and neither had any
          # way of noticing a ninth tool, so the surface could grow past FR-18's
          # cap with the check still green.
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { resolve } from "node:path";
            import { pathToFileURL } from "node:url";
            const load = (p) => import(pathToFileURL(resolve(p)).href);
            const { loadConfig } = await load("dist/config.js");
            const { advertisedTools, ALL_TOOLS } = await load("dist/tools/definitions.js");
            const config = loadConfig({
              UNIFI_API_KEY: "ci-smoke-test-placeholder-key",
              UNIFI_CONSOLE_ID: "0000000000000000",
              UNIFI_ENABLE_WRITES: "network,protect",
            });
            const expected = advertisedTools(config.enabledServices, config.writesEnabled)
              .map((t) => t.name)
              .sort();
            const payload = JSON.parse(readFileSync("tools-list.json", "utf8"));
            const advertised = (payload.tools ?? []).map((t) => t.name).sort();
            // Anti-vacuity: an empty computed surface would make every
            // comparison below pass by having nothing to compare. Written as a
            // truthiness test rather than `=== 0` on purpose — FR-74 limb 1
            // rejects an integer literal compared against a tool-set count,
            // and this file is in that scan is scope.
            if (!expected.length) {
              console.error("::error title=Vacuous check::the registry computed an empty tool surface.");
              process.exit(1);
            }
            const missing = expected.filter((n) => !advertised.includes(n));
            const unexpected = advertised.filter((n) => !expected.includes(n));
            if (missing.length || unexpected.length) {
              console.error("::error title=tools/list drifted from the registry::missing: " +
                (missing.join(", ") || "(none)") + " | unexpected: " + (unexpected.join(", ") || "(none)"));
              console.error("advertised: " + advertised.join(", "));
              console.error("computed:   " + expected.join(", "));
              process.exit(1);
            }
            // FR-18 caps the advertised surface. The cap is the DECLARED tool
            // set, read from the same module — not the literal 12 it replaces.
            if (advertised.length > ALL_TOOLS.length) {
              console.error("::error title=Too many tools::tools/list advertises " + advertised.length +
                " tools; the declared surface holds " + ALL_TOOLS.length + " (FR-18).");
              process.exit(1);
            }
            console.log("Inspector smoke test OK: " + advertised.length +
              " tools advertised, equal to the surface the registry computes for this configuration.");
          '

      # US-31: the HTTP analogue of the stdio smoke test above, driving the same
      # Inspector against a real bound listener with a real `Authorization`
      # header. POSIX legs only — the script spawns a server process, reads its
      # bound ephemeral port off stderr and signals it on the way out, and this
      # round's standing owner decision (OQ-18, NFR-27) makes Windows a
      # development and stdio platform rather than an HTTP deployment target.
      #
      # `ci.yml` already runs on `pull_request` across the matrix, so unlike the
      # container workflow this venue gates a merge as it stands.
      - name: MCP Inspector CLI smoke test over HTTP
        if: runner.os != 'Windows'
        shell: bash
        run: npm run inspect:cli:http

      - name: Upload tools/list output
        if: always() && hashFiles('tools-list.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tools-list-${{ matrix.os }}
          path: tools-list.json
          if-no-files-found: ignore

  # NFR-28 / §14 item 17. The declared RANGE is `~1.30.0`; the LOCKFILE holds
  # whatever `npm ci` resolved on the day it was written. Those two differ, and
  # a build that is green against the lockfile can be broken for everyone who
  # installs from the manifest — which is the whole population that does not
  # have this repository's `package-lock.json`.
  #
  # This job carries NO `continue-on-error` and belongs in the workflow's
  # required-status set. A non-blocking floor check is precisely the defect
  # NFR-28 was written against: it would observe the breakage and ship it.
  sdk-floor:
    name: sdk-floor (declared floor, blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Read out of package.json rather than written out again here, so the
      # floor this job installs cannot drift from the one the manifest
      # declares. `test/sdk-floor.test.ts` asserts that declared string is
      # exactly `~1.30.0`, which is the other half of the same guarantee.
      - name: Resolve the declared floor
        id: floor
        shell: bash
        run: |
          set -euo pipefail
          FLOOR="$(node -p "require('./package.json').dependencies['@modelcontextprotocol/sdk'].replace(/^[~^]/, '')")"
          echo "version=${FLOOR}" >> "$GITHUB_OUTPUT"
          echo "Declared floor: ${FLOOR}"

      - name: Override the lockfile with the exact floor
        run: npm i --no-save "@modelcontextprotocol/sdk@${{ steps.floor.outputs.version }}"

      # Without this the job could silently keep testing the lockfile's version
      # if the install ever became a no-op, which is the failure mode that
      # makes a floor check look green and prove nothing.
      - name: Confirm the floor is what is installed
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED="$(node -p "require('./node_modules/@modelcontextprotocol/sdk/package.json').version")"
          echo "Installed: ${INSTALLED}"
          test "${INSTALLED}" = "${{ steps.floor.outputs.version }}"

      - name: Build
        run: npm run build

      # The serving-transport suite: every SDK behaviour this product relies on
      # is exercised here, so this is what the floor has to survive.
      - name: Serving-transport suite against the floor
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-timeout=60000 --import tsx \
            test/serve-*.test.ts test/runtime.test.ts test/signals.test.ts \
            test/healthcheck.test.ts test/instruments.test.ts

  # NFR-28's other half (R-16). Same steps, against `@latest`, so an SDK bump
  # arrives as a pull request rather than as a silent production change.
  #
  # It carries `continue-on-error: true` and is EXCLUDED from the required-status
  # set on purpose: a vendor release must not turn a commit red that changed
  # nothing. The `schedule:` trigger at the top of this file is what makes it
  # report between pull requests rather than only alongside them.
  sdk-canary:
    name: sdk-canary (@latest, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the latest SDK
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          npm i --no-save "@modelcontextprotocol/sdk@latest"
          RESOLVED="$(node -p "require('./node_modules/@modelcontextprotocol/sdk/package.json').version")"
          echo "version=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "Resolved @latest: ${RESOLVED}"

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Serving-transport suite against @latest
        id: suite
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-timeout=60000 --import tsx \
            test/serve-*.test.ts test/runtime.test.ts test/signals.test.ts \
            test/healthcheck.test.ts test/instruments.test.ts

      # The report is the deliverable, so it is written whatever happened above.
      - name: Report drift to the job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DECLARED="$(node -p "require('./package.json').dependencies['@modelcontextprotocol/sdk']")"
          {
            echo "### sdk-canary"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Declared range | \`${DECLARED}\` |"
            echo "| Resolved \`@latest\` | \`${LATEST}\` |"
            echo "| Build | \`${BUILD_OUTCOME}\` |"
            echo "| Serving-transport suite | \`${SUITE_OUTCOME}\` |"
            echo
            if [ "${BUILD_OUTCOME}" = "success" ] && [ "${SUITE_OUTCOME}" = "success" ]; then
              echo "No drift: \`@latest\` (\`${LATEST}\`) builds and passes the serving-transport suite."
            else
              echo "**Drift detected against \`@latest\` (\`${LATEST}\`).**"
              echo "This job does not gate — open a pull request that raises the declared floor"
              echo "and fixes what broke, rather than letting the bump arrive silently (NFR-28, R-16)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          LATEST: ${{ steps.latest.outputs.version }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
